version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: habit-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habit_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: habit-redis

    ports:
      - "6379:6379"

  backend:
    build: ./backend

    container_name: habit-backend

    depends_on:
      - postgres
      - redis

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend

    container_name: habit-frontend

    depends_on:
      - backend

    ports:
      - "3000:80"

  celery:
    build: ./backend

    container_name: habit-celery

    command: celery -A app.workers.celery_app.celery worker --pool=solo --loglevel=info

    depends_on:
      - backend
      - redis

    env_file:
      - ./backend/.env

volumes:
  postgres_data: